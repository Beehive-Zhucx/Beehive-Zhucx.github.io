name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare ShokaX paths
        run: |
          ln -s hexo-theme-shokaX-main themes/hexo-theme-shokax-main
          ln -s hexo-theme-shokaX-main themes/shokaX
          mkdir -p source/_data/assets

      - name: Install root dependencies
        run: npm ci

      - name: Restore ShokaX build sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("themes/hexo-theme-shokaX-main-source-backup.zip")
          destination = Path("themes/hexo-theme-shokaX-main/scripts").resolve()

          with ZipFile(archive) as source_archive:
            for entry in source_archive.infolist():
              relative_path = Path(entry.filename.replace("\\", "/"))
              target = (destination / relative_path).resolve()
              target.relative_to(destination)
              if entry.is_dir():
                target.mkdir(parents=True, exist_ok=True)
              else:
                target.parent.mkdir(parents=True, exist_ok=True)
                target.write_bytes(source_archive.read(entry))
          PY
          test -f themes/hexo-theme-shokaX-main/scripts/generaters/index.ts

      - name: Build ShokaX theme
        working-directory: themes/hexo-theme-shokaX-main
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Generate site
        run: |
          npm run build
          test -s public/index.html
          test -s public/js/siteInit.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4